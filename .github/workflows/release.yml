name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: |
          bash tests/test-install.sh
          bash scripts/check-anti-leak.sh
      - name: Build archive and checksum
        run: |
          name="paperclip-fr-${GITHUB_REF_NAME}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="${name}/" -o "dist/${name}.tar.gz" HEAD
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "paperclip-fr $GITHUB_REF_NAME" --notes-file release-notes.md
